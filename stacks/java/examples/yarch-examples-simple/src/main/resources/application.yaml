spring:
  application:
    name: yarch-examples-simple
  datasource:
    url: jdbc:postgresql://localhost:5432/yarch-examples-simple
    username: yarch-examples-simple
    password: yarch-examples-simple
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

mybatis-plus:
  global-config:
    banner: false

yarch:
  env: local
  redis:
    # Redis JSON 值反序列化白名单：example 缓存做类型化回读，登记自身包前缀
    json-trusted-packages: io.github.ydonghao.yarch.examples
