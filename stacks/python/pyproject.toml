[project]
name = "yarch-python-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
yarch-python = { workspace = true }
yarch-init = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "testcontainers[postgres,redis]>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages"]
# _template 下的 tests/ 是渲染源资产（依赖生成工程的包布局），不参与本仓收集
norecursedirs = [".*", "_template"]
markers = ["integration: needs docker (testcontainers)"]

[tool.mypy]
files = ["packages"]
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_packages = ["yarch_python"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Kernel trio has zero framework dependencies"
type = "forbidden"
source_modules = [
    "yarch_python.response",
    "yarch_python.errcode",
    "yarch_python.xerror",
]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "redis",
    "celery",
    "httpx",
    "structlog",
]
