<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1110" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1180" height="1110" fill="#f8fafc"/>
  <text x="590" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">yarch-golang · 架构总览（Hertz + DDD 七包）</text>
  <text x="590" y="72" text-anchor="middle" font-size="13" fill="#64748b">结构同构 coze-studio · 实践反向沉淀 yagent · 语义按 contract/ 重铸 —— 橙标徽章为待拍板决策（G1-G9）</text>

  <!-- L1 业务工程层 -->
  <rect x="60" y="100" width="1060" height="140" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="80" y="128" font-size="15" font-weight="700" fill="#3730a3">① 业务工程（模板生成 · 服务名过 registry.md 一-1 校验）</text>
  <rect x="1024" y="108" width="86" height="20" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1067" y="122" text-anchor="middle" font-size="10.5" fill="#c2410c">G6 分发待拍板</text>
  <rect x="80" y="142" width="640" height="84" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="400" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">yarch-go-template（DDD 七包 · 默认档）</text>
  <text x="400" y="190" text-anchor="middle" font-size="11.5" fill="#475569">api(handler/middleware/router) · application · domain(entity/repository/service)</text>
  <text x="400" y="210" text-anchor="middle" font-size="11.5" fill="#475569">crossdomain（域间防腐） · infrastructure(contract/impl) · types · cmd/server</text>
  <rect x="740" y="142" width="360" height="84" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-dasharray="6 4"/>
  <text x="920" y="172" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4338ca">simple 档（五层贫血）—— 按触发不预铺</text>
  <text x="920" y="196" text-anchor="middle" font-size="11.5" fill="#64748b">golang 单模板起步（对照 java 双模板 J1-D）</text>

  <line x1="590" y1="240" x2="590" y2="278" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="604" y="266" font-size="11.5" fill="#475569">模板生成（gonew / yarch init，G6 待拍板）· 平台件经 go get 引入，只编译 import 的包</text>

  <!-- L2 显式装配层 -->
  <rect x="60" y="280" width="1060" height="120" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="80" y="308" font-size="15" font-weight="700" fill="#155e75">② 显式装配（Go 无自动装配 —— Setup 装配函数 + Makefile 即「Web 装配」对偶物）</text>
  <rect x="862" y="288" width="118" height="20" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="921" y="302" text-anchor="middle" font-size="10.5" fill="#c2410c">G4 配置管理待拍板</text>
  <g font-size="12.5" fill="#0f172a">
    <rect x="80"  y="322" width="300" height="56" rx="8" fill="#fff" stroke="#67e8f9"/><text x="230" y="346" text-anchor="middle">main.go → cmd/server</text><text x="230" y="365" text-anchor="middle" fill="#64748b" font-size="11">env → logx → PG/Redis → router → Run</text>
    <rect x="400" y="322" width="300" height="56" rx="8" fill="#fff" stroke="#67e8f9"/><text x="550" y="346" text-anchor="middle">yarch.Setup(h)</text><text x="550" y="365" text-anchor="middle" fill="#64748b" font-size="11">一行挂全中间件链 · 顺序即语义</text>
    <rect x="720" y="322" width="180" height="56" rx="8" fill="#fff" stroke="#67e8f9"/><text x="810" y="346" text-anchor="middle">conf</text><text x="810" y="365" text-anchor="middle" fill="#64748b" font-size="11">.env 三环境 → 结构体</text>
    <rect x="920" y="322" width="180" height="56" rx="8" fill="#fff" stroke="#67e8f9"/><text x="1010" y="346" text-anchor="middle">Makefile · compose</text><text x="1010" y="365" text-anchor="middle" fill="#64748b" font-size="11">多阶段 Dockerfile</text>
  </g>

  <line x1="590" y1="400" x2="590" y2="438" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="604" y="426" font-size="11.5" fill="#475569">Setup() 装配的正是这些 package —— 显式 import · 不启用的规约不进构建图（按需组合无全家桶）</text>

  <!-- L3 平台构件层 -->
  <rect x="60" y="440" width="1060" height="252" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="80" y="468" font-size="15" font-weight="700" fill="#14532d">③ 平台构件 yarch-go（一规约一 package，对偶 java 一规约一 starter）</text>
  <rect x="738" y="454" width="176" height="20" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="826" y="468" text-anchor="middle" font-size="10.5" fill="#c2410c">G1 单module / G3 ORM 待拍板</text>
  <g font-size="12.5" fill="#0f172a">
    <rect x="80"  y="482" width="165" height="78" rx="8" fill="#fff" stroke="#86efac"/><text x="162" y="504" text-anchor="middle" font-weight="600">contract</text><text x="162" y="522" text-anchor="middle" fill="#64748b" font-size="10.5">Response · PageData</text><text x="162" y="540" text-anchor="middle" fill="#64748b" font-size="10.5">13 码 · xerror · 零依赖</text>
    <rect x="257" y="482" width="165" height="78" rx="8" fill="#fff" stroke="#86efac"/><text x="339" y="504" text-anchor="middle" font-weight="600">web</text><text x="339" y="522" text-anchor="middle" fill="#64748b" font-size="10.5">信封 · 异常→码表</text><text x="339" y="540" text-anchor="middle" fill="#64748b" font-size="10.5">1001 · 分页 · 幂等</text>
    <rect x="434" y="482" width="165" height="78" rx="8" fill="#fff" stroke="#86efac"/><text x="516" y="504" text-anchor="middle" font-weight="600">logx</text><text x="516" y="522" text-anchor="middle" fill="#64748b" font-size="10.5">slog ndjson</text><text x="516" y="540" text-anchor="middle" fill="#64748b" font-size="10.5">Trace · ctx 贯穿</text>
    <rect x="611" y="482" width="165" height="78" rx="8" fill="#fff" stroke="#86efac"/><text x="693" y="504" text-anchor="middle" font-weight="600">persist</text><text x="693" y="522" text-anchor="middle" fill="#64748b" font-size="10.5">GORM(pgx) · migrate</text><text x="693" y="540" text-anchor="middle" fill="#64748b" font-size="10.5">逻辑删除 · 审计 · 分页</text>
    <rect x="788" y="482" width="165" height="78" rx="8" fill="#fff" stroke="#86efac"/><text x="870" y="504" text-anchor="middle" font-weight="600">redix</text><text x="870" y="522" text-anchor="middle" fill="#64748b" font-size="10.5">key 首段=服务名</text><text x="870" y="540" text-anchor="middle" fill="#64748b" font-size="10.5">JSON · 锁 · 幂等存储</text>
    <rect x="965" y="482" width="135" height="78" rx="8" fill="#fff" stroke="#86efac"/><text x="1032" y="504" text-anchor="middle" font-weight="600">httpx</text><text x="1032" y="522" text-anchor="middle" fill="#64748b" font-size="10.5">超时强制 · 注入</text><text x="1032" y="540" text-anchor="middle" fill="#64748b" font-size="10.5">解包 · 1008/1009</text>
  </g>
  <rect x="80" y="570" width="1020" height="40" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="590" y="594" text-anchor="middle" font-size="11" fill="#166534">testx 基座：契约断言（13 码全表 · 信封 · ndjson 字段级 · PG 行为级）+ depguard 依赖方向机检（domain 零框架依赖，对偶 ArchUnit）+ testcontainers-go</text>
  <rect x="80" y="618" width="1020" height="64" rx="8" fill="#ffffff" stroke="#86efac" stroke-dasharray="6 4"/>
  <text x="590" y="640" text-anchor="middle" font-size="12" fill="#166534">yagent 反向沉淀（结构沿用 · 语义重铸）：pkg/errorx 机制 + ctxcache + logs 升格为平台件</text>
  <text x="590" y="660" text-anchor="middle" font-size="11" fill="#15803d">正名三处：errno 旧口径（1000=成功）→ 契约口径（0=成功 + 13 码全表）；logID → W3C traceparent；MySQL → PG 默认档</text>

  <line x1="590" y1="692" x2="590" y2="730" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="604" y="718" font-size="11.5" fill="#475569">实现对齐契约（术语由契约锁定 · 不一致即 bug）</text>

  <!-- L4 统一契约层 -->
  <rect x="60" y="732" width="1060" height="118" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="80" y="760" font-size="15" font-weight="700" fill="#713f12">④ 统一契约（contract/，唯一权威 —— 实现不一致即 bug）</text>
  <text x="80" y="784" font-size="12.5" fill="#422006">api 四件套：RestResponse 形状 · 错误码段位（0/1xxx/2xxx 归 yarch，3xxx+ 业务仓登记）· logging-trace（ndjson + W3C traceparent）</text>
  <text x="80" y="806" font-size="12.5" fill="#422006">REST 约定（kebab-case · /api/v1/ · D6 空页 · Idempotency-Key）· infra 20 份按需组合（PG 默认 · MQ 双轨 · 向量三档 · OLAP 双擎）</text>
  <text x="80" y="830" font-size="12.5" font-weight="600" fill="#854d0e">golang 术语（契约已锁定）：response.Response · response.PageData · errcode.Code · xerror.BizError · middleware.Trace() · logx</text>

  <line x1="590" y1="850" x2="590" y2="882" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L5 运行底座 -->
  <rect x="60" y="884" width="1060" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="916" font-size="14" font-weight="700" fill="#334155">⑤ 运行底座</text>
  <text x="180" y="916" font-size="12.5" fill="#475569">Go 工具链 1.26 · go.mod 基线 1.24 · Hertz · PG 17 · Redis 7 · Docker 多阶段 · golangci-lint CI 门禁</text>
  <rect x="950" y="892" width="158" height="20" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1029" y="906" text-anchor="middle" font-size="10.5" fill="#c2410c">G8 版本基线待拍板</text>

  <!-- L6 Hertz 请求生命周期 -->
  <rect x="60" y="956" width="1060" height="124" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="80" y="982" font-size="14" font-weight="700" fill="#0f172a">⑥ Hertz 请求生命周期（中间件链 → 七包调用链 → 回程信封；architecture.md 三·五点名件）</text>
  <g font-size="11.5" fill="#0f172a">
    <rect x="80"  y="996" width="70"  height="44" rx="7" fill="#f1f5f9" stroke="#94a3b8"/><text x="115" y="1015" text-anchor="middle" font-weight="600">请求</text><text x="115" y="1031" text-anchor="middle" fill="#64748b" font-size="9.5">/api/v1/…</text>
    <rect x="164" y="996" width="92"  height="44" rx="7" fill="#ecfeff" stroke="#22d3ee"/><text x="210" y="1015" text-anchor="middle" font-weight="600">Trace 入口</text><text x="210" y="1031" text-anchor="middle" fill="#64748b" font-size="9.5">继承/生成</text>
    <rect x="270" y="996" width="84"  height="44" rx="7" fill="#ecfeff" stroke="#22d3ee"/><text x="312" y="1015" text-anchor="middle" font-weight="600">Recovery</text><text x="312" y="1031" text-anchor="middle" fill="#64748b" font-size="9.5">panic→1000</text>
    <rect x="368" y="996" width="86"  height="44" rx="7" fill="#ecfeff" stroke="#22d3ee"/><text x="411" y="1015" text-anchor="middle" font-weight="600">AccessLog</text><text x="411" y="1031" text-anchor="middle" fill="#64748b" font-size="9.5">ndjson·ms</text>
    <rect x="468" y="996" width="64"  height="44" rx="7" fill="#ecfeff" stroke="#22d3ee"/><text x="500" y="1015" text-anchor="middle" font-weight="600">CORS</text><text x="500" y="1031" text-anchor="middle" fill="#64748b" font-size="9.5">跨域</text>
    <rect x="546" y="996" width="80"  height="44" rx="7" fill="#ecfeff" stroke="#22d3ee"/><text x="586" y="1015" text-anchor="middle" font-weight="600">幂等</text><text x="586" y="1031" text-anchor="middle" fill="#64748b" font-size="9.5">回放/1007</text>
    <rect x="640" y="996" width="96"  height="44" rx="7" fill="#eef2ff" stroke="#818cf8"/><text x="688" y="1015" text-anchor="middle" font-weight="600">Handler · api</text><text x="688" y="1031" text-anchor="middle" fill="#64748b" font-size="9.5">DTO↔领域</text>
    <rect x="750" y="996" width="100" height="44" rx="7" fill="#eef2ff" stroke="#818cf8"/><text x="800" y="1015" text-anchor="middle" font-weight="600">Application</text><text x="800" y="1031" text-anchor="middle" fill="#64748b" font-size="9.5">编排·事务</text>
    <rect x="864" y="996" width="76"  height="44" rx="7" fill="#eef2ff" stroke="#818cf8"/><text x="902" y="1015" text-anchor="middle" font-weight="600">Domain</text><text x="902" y="1031" text-anchor="middle" fill="#64748b" font-size="9.5">entity</text>
    <rect x="954" y="996" width="94"  height="44" rx="7" fill="#eef2ff" stroke="#818cf8"/><text x="1001" y="1015" text-anchor="middle" font-weight="600">Repository</text><text x="1001" y="1031" text-anchor="middle" fill="#64748b" font-size="9.5">domain 定接口</text>
    <line x1="152" y1="1018" x2="162" y2="1018" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowH)"/>
    <line x1="258" y1="1018" x2="266" y2="1018" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowH)"/>
