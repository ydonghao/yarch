# 本地基础设施（复用共享实例时改为指向既有地址 + key/database 前缀隔离）
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: my_svc
      POSTGRES_USER: my_svc
      POSTGRES_PASSWORD: my_svc
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
