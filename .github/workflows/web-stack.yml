name: web-stack

on:
  push:
    branches: [main]
    paths: ['stacks/web/**', '.github/workflows/web-stack.yml']
  pull_request:
    paths: ['stacks/web/**', '.github/workflows/web-stack.yml']

jobs:
  build:
    name: Node ${{ matrix.node }} · 全量验证
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: stacks/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: stacks/web/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile
      - name: 契约断言测试
        run: pnpm --filter @yarch/contract test
      - name: 依赖方向机检
        run: pnpm exec depcruise packages/contract/src packages/react/src packages/vue/src packages/create/templates/admin-semi/src packages/create/templates/admin-antd/src packages/create/templates/admin-arco/src examples/admin-demo/src --config depcruise.config.js
      - name: 生成后冒烟（W9：三档 生成 → install → tsc → build）
        run: |
          SMOKE="$(mktemp -d)"
          for t in semi antd arco; do
            echo "=== admin-$t ==="
            # --deps file：CI 用仓内底座源码，不依赖 registry（发版前/测试未发布变更均成立）
            node packages/create/bin/create-admin.mjs "smoke-$t" --ui "$t" --yes --deps file --out "$SMOKE/admin-$t"
            ( cd "$SMOKE/admin-$t" && pnpm install --no-frozen-lockfile && pnpm exec tsc --noEmit && pnpm exec vite build )
          done
