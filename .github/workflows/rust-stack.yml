name: rust-stack

# rust 栈 CI：四段门禁（fmt / clippy -D warnings / cargo-deny / test，spec 九-1）+ MSRV 双档（R7）
# + cargo-generate 模板冒烟（spec 九-3；生成 → 零残留 → test → clippy）。
# conformance 测试读仓内 contract/dist/error-codes.json（提交态在场，contract-dist 门拒漂移）。

on:
  push:
    branches: [main, dev]
    paths: ['stacks/rust/**', '.github/workflows/rust-stack.yml']
  pull_request:
    paths: ['stacks/rust/**', '.github/workflows/rust-stack.yml']

jobs:
  check:
    name: Rust ${{ matrix.toolchain }} · 四段门禁
    strategy:
      fail-fast: false
      matrix:
        # R7：stable + MSRV 1.80 双档（dtolnay 动作以 RUSTUP_TOOLCHAIN 覆盖 rust-toolchain.toml）
        toolchain: [stable, '1.80']
    runs-on: ubuntu-latest
    # job 级 env 压过目录级 rust-toolchain.toml（1.95.0 本地档）——否则矩阵 toolchain
    # 被覆盖、rustfmt/clippy 组件缺失即红（RUSTUP_TOOLCHAIN 优先级 > toolchain file）
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    defaults:
      run:
        working-directory: stacks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stacks/rust/Cargo.toml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    name: cargo-deny · 依赖审计
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  template-smoke:
    name: cargo generate 模板冒烟
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # cargo-generate 0.22.1：最新版依赖链要求 rustc 1.96（超 stable 档）——钉版本源装
      - run: cargo install cargo-generate --locked --version 0.22.1
      - name: 生成（yarch 依赖以 path 覆盖 git tag 默认——发版前过渡，golang replace 行对偶）
        run: |
          cargo generate --path stacks/rust/templates/service --name smoke-svc \
            --define "yarch_contract_dep={ path = '$GITHUB_WORKSPACE/stacks/rust/crates/yarch-contract' }" \
            --define "yarch_axum_dep={ path = '$GITHUB_WORKSPACE/stacks/rust/crates/yarch-axum' }" \
            --destination /tmp
      - name: 零残留 + test + clippy
        run: |
          cd /tmp/smoke-svc
          RESIDUAL=$(grep -rln '{{' --include='*.rs' --include='*.toml' --include='*.md' . || true)
          [ -z "$RESIDUAL" ] || { echo "残留占位符: $RESIDUAL"; exit 1; }
          cargo test
          cargo clippy --all-targets -- -D warnings
