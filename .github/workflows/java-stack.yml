name: java-stack

on:
  push:
    branches: [main]
    paths: ['stacks/java/**', '.github/workflows/java-stack.yml']
  pull_request:
    paths: ['stacks/java/**', '.github/workflows/java-stack.yml']

jobs:
  build:
    name: JDK ${{ matrix.java }} · 全模块 verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 工具链 25 + 字节码 release 21：双运行时验证兼容面（J3b）
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: 全模块构建 + 契约断言 + Testcontainers 集成
        run: mvn -B -f stacks/java/pom.xml verify

  archetype-smoke:
    name: 双 archetype 生成工程冒烟
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 安装全部构件到本地仓库
        run: mvn -B -f stacks/java/pom.xml install -DskipTests
      - name: 生成 ddd 工程并全链路验收
        run: |
          mvn -B archetype:generate \
            -DarchetypeGroupId=io.github.yuandonghao \
            -DarchetypeArtifactId=yarch-archetype-ddd \
            -DarchetypeVersion=0.1.0-SNAPSHOT \
            -DgroupId=io.github.yuandonghao.ci -DartifactId=ci-ddd-svc \
            -Dpackage=io.github.yuandonghao.ciddd -Dversion=0.1.0-SNAPSHOT
          mvn -B -f ci-ddd-svc/pom.xml verify
      - name: 生成 simple 工程并全链路验收
        run: |
          mvn -B archetype:generate \
            -DarchetypeGroupId=io.github.yuandonghao \
            -DarchetypeArtifactId=yarch-archetype-simple \
            -DarchetypeVersion=0.1.0-SNAPSHOT \
            -DgroupId=io.github.yuandonghao.ci -DartifactId=ci-simple-svc \
            -Dpackage=io.github.yuandonghao.cisimple -Dversion=0.1.0-SNAPSHOT
          mvn -B -f ci-simple-svc/pom.xml verify
