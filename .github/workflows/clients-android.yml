name: clients-android

# 移动端 android CI（clients/PLAN.md C8/C9）：
# check = 契约内核（纯 JVM，无 SDK）；template-smoke = 双基线档经生成器生成后构建（模板正确性由生成后冒烟保证）。
# ktlint/detekt 已随模板 build-logic 预接线（convention plugins），模板构建即机检。

on:
  push:
    branches: [main, dev]
    paths: ['clients/android/**', 'clients/create/**', '.github/workflows/clients-android.yml']
  pull_request:
    paths: ['clients/android/**', 'clients/create/**', '.github/workflows/clients-android.yml']

jobs:
  generator-smoke:
    name: 生成器冒烟（生成 → 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # packages 显式覆盖：action 默认含已下架的 'tools' 包，安装即失败
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: 生成 android 工程（yarch-init-app）
        run: |
          node clients/create/bin/yarch-init-app.mjs ysaas-demo --platform android --yes \
            --registry contract/registry.md --out /tmp/gen-android
      - name: 生成工程构建（模板正确性兜底）
        run: |
          cd /tmp/gen-android
          chmod +x gradlew && ./gradlew build --no-daemon

  check:
    name: JDK ${{ matrix.java }} · 契约内核 build + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --no-daemon

  template-smoke:
    name: 模板冒烟 · ${{ matrix.baseline }}（生成 → 构建）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        baseline: ['android-minsdk26', 'android-minsdk24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v6
      - name: 生成 ${{ matrix.baseline }} 档工程（yarch-init-app --baseline）
        run: |
          node clients/create/bin/yarch-init-app.mjs ysaas-demo --platform android --baseline ${{ matrix.baseline }} --yes \
            --registry contract/registry.md --out /tmp/gen-${{ matrix.baseline }}
      - name: 生成工程构建（模板正确性兜底）
        run: |
          cd /tmp/gen-${{ matrix.baseline }}
          chmod +x gradlew && ./gradlew build --no-daemon
