version: 2
updates:
  # CI/Action 依赖（全部 workflow）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-actions:
        patterns: ["*"]
  # java 栈（Maven reactor 16 模块）
  - package-ecosystem: maven
    directory: /stacks/java
    schedule:
      interval: weekly
  # web 栈（pnpm workspace）与客户端生成器（npm 包）
  - package-ecosystem: npm
    directory: /stacks/web
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /clients/create
    schedule:
      interval: weekly
  # python 栈（uv workspace）
  - package-ecosystem: pip
    directory: /stacks/python
    schedule:
      interval: weekly
  # golang 栈（主 module；testcontainers 子 module 同目录解析）
  - package-ecosystem: gomod
    directory: /stacks/golang
    schedule:
      interval: weekly
