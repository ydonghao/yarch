  <text x="64" y="684" font-size="12.5" font-weight="600" fill="#92400e">分界铁律 —— yarch（通用） vs 业务工程（领域）</text>
  <text x="64" y="706" font-size="11.5" fill="#78350f">yarch 收：日志 · 错误码/RestResponse · 幂等/锁 · 审计埋点框架 · 测试基座 · CI 模板 · DDD archetype —— 任何工程都需要，不带业务语义</text>
  <text x="64" y="724" font-size="11.5" fill="#78350f">业务工程收：领域横切，如 ysaas-tenant-spring-boot-starter（tenant_id 拦截器）· INV 不变式门禁 · 配额原语 —— 铁律：yarch 不得含任何 SaaS/租户语义</text>
